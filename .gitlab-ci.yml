# Mêmes vérifications que .github/workflows/ci.yml : garder les deux fichiers alignés

# Une seule pipeline par push : celle de la merge request quand il y en a une, sinon celle de la branche
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  # pnpm à la version fixée par le champ packageManager de package.json
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# Base des tests (créée et migrée par les tests eux-mêmes), accessible sous le nom « db »
.postgres:
  services:
    - name: postgres:18-alpine
      alias: db
  variables:
    POSTGRES_USER: docforge
    POSTGRES_PASSWORD: password
    POSTGRES_DB: docforge_test
    TEST_DATABASE_URL: postgres://docforge:password@db:5432/docforge_test

verify:
  extends: .postgres
  image: node:24-slim
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile --store-dir .pnpm-store
  script:
    - pnpm lint
    - pnpm format:check
    - pnpm typecheck
    - pnpm test
    - pnpm build

e2e:
  extends: .postgres
  # Image complète (pas slim) : Playwright installe les dépendances système de Chromium
  image: node:24
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile --store-dir .pnpm-store
    - pnpm --filter @template-generator/e2e exec playwright install --with-deps chromium
  script:
    - pnpm test:e2e
  artifacts:
    when: on_failure
    paths: [e2e/playwright-report, e2e/test-results]
    expire_in: 1 week
