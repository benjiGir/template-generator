# Mêmes vérifications que .github/workflows/ci.yml : garder les deux fichiers alignés.
# En plus, ici seulement : construction des images et envoi sur le registry du cluster (stage « publish »).

# Une seule pipeline par push : celle de la merge request quand il y en a une, sinon celle de la branche
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    # Tag git (v1.1…) : images publiées sous ce tag
    - if: $CI_COMMIT_TAG

stages: [test, publish]

variables:
  # pnpm à la version fixée par le champ packageManager de package.json
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # Proposées dans le formulaire « Run pipeline » (Build → Pipelines → Run pipeline)
  IMAGE_TAG:
    value: ""
    description: "Tag des images à publier (ex. v1.1), en plus de latest. Vide : nom de la branche."
  REGISTRY_IMAGE:
    value: registry.lan.codyssee.tech/docforge
    description: "Registry et dossier des images : <REGISTRY_IMAGE>/back et <REGISTRY_IMAGE>/front."

# Base des tests (créée et migrée par les tests eux-mêmes), accessible sous le nom « db »
.postgres:
  services:
    - name: postgres:18-alpine
      alias: db
  variables:
    POSTGRES_USER: docforge
    POSTGRES_PASSWORD: password
    POSTGRES_DB: docforge_test
    TEST_DATABASE_URL: postgres://docforge:password@db:5432/docforge_test

verify:
  extends: .postgres
  image: node:24-slim
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile --store-dir .pnpm-store
  script:
    - pnpm lint
    - pnpm format:check
    - pnpm typecheck
    - pnpm test
    - pnpm build

e2e:
  extends: .postgres
  # Image complète (pas slim) : Playwright installe les dépendances système de Chromium
  image: node:24
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile --store-dir .pnpm-store
    - pnpm --filter @template-generator/e2e exec playwright install --with-deps chromium
  script:
    - pnpm test:e2e
  artifacts:
    when: on_failure
    paths: [e2e/playwright-report, e2e/test-results]
    expire_in: 1 week

# Images de l'API (back) et du front (front), construites avec Podman sur le runner (x86_64, comme le cluster),
# chacune dans son job : un build par conteneur, donc l'espace disque du runner pour chacun.
#   - main : automatique, tags main et latest
#   - Run pipeline : automatique, tags IMAGE_TAG (sinon nom de la branche) et latest
#   - autres branches : boutons manuels « publish-back » et « publish-front »
# Podman demande un runner privilégié.
.publish:
  stage: publish
  image: quay.io/podman/stable:v5.8.2
  # N'attend pas les tests : lançable à tout moment, même si une vérification échoue
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: manual
      allow_failure: true
  script:
    # Tag choisi dans « Run pipeline », sinon le nom de la branche (main…)
    - TAG="${IMAGE_TAG:-$CI_COMMIT_REF_SLUG}"
    - podman build -f "$DOCKERFILE" -t "$REGISTRY_IMAGE/$IMAGE:$TAG" -t "$REGISTRY_IMAGE/$IMAGE:latest" .
    - podman push "$REGISTRY_IMAGE/$IMAGE:$TAG"
    - podman push "$REGISTRY_IMAGE/$IMAGE:latest"

publish-back:
  extends: .publish
  variables:
    IMAGE: back
    DOCKERFILE: Dockerfile.api

publish-front:
  extends: .publish
  variables:
    IMAGE: front
    DOCKERFILE: Dockerfile.web
