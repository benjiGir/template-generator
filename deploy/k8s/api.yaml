# API Hono. Avant de démarrer, le pod applique les migrations et ajoute les thèmes intégrés manquants.
apiVersion: v1
kind: Service
metadata:
  name: docforge-api
  labels:
    app.kubernetes.io/name: docforge-api
spec:
  selector:
    app.kubernetes.io/name: docforge-api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docforge-api
  labels:
    app.kubernetes.io/name: docforge-api
spec:
  # Une seule instance : les migrations tournent au démarrage du pod, jamais deux à la fois
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: docforge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docforge-api
    spec:
      # Tant que la base n'est pas prête, la migration échoue et Kubernetes la relance
      initContainers:
        - name: migrate
          image: docforge-api
          imagePullPolicy: Always
          command: ["pnpm", "--filter", "@template-generator/api", "run", "db:migrate"]
          resources: &resources
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env: &database # Mot de passe hors de l'URL : lu par le pilote PostgreSQL, quels que soient ses caractères
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: docforge-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://docforge@docforge-db:5432/docforge
        - name: builtin-themes
          image: docforge-api
          imagePullPolicy: Always
          command: ["pnpm", "--filter", "@template-generator/api", "run", "db:seed:themes"]
          env: *database
          resources: *resources
      containers:
        - name: api
          image: docforge-api
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            # Mot de passe hors de l'URL : lu par le pilote PostgreSQL, quels que soient ses caractères
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: docforge-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://docforge@docforge-db:5432/docforge
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: production
            # Garde le tas de Node sous la limite mémoire du conteneur
            - name: NODE_OPTIONS
              value: --max-old-space-size=384
          # Avec 0,5 CPU, le démarrage (compilation par tsx) prend quelques secondes de plus
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          resources: *resources
