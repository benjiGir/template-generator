# Accès au site : route du Gateway partagé (Gateway API) vers le front.
# nginx (docforge-web) sert l'application et relaie lui-même /api vers docforge-api : une seule règle suffit.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docforge-web
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: docforge
  hostnames:
    - docforge.lan.codyssee.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: docforge-web
          port: 80
