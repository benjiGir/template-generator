apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docforge-web
  namespace: docforge
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: docforge
  hostnames:
    - docforge.lan.codyssee.tech
  rules:
    - backendRefs:
        - name: docforge-web
          port: 80