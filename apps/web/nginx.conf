# Modèle lu au démarrage par l'image nginx : ${API_UPSTREAM} est remplacé par la variable d'environnement
# (http://api:3001 avec docker-compose, le Service de l'API dans Kubernetes). Les variables nginx ($uri…) restent.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Un template ou un document entier passe dans une requête
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fichiers du build nommés par leur contenu : mis en cache sans limite
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Application monopage : toute autre adresse renvoie index.html, jamais mis en cache
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
